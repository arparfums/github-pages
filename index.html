<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Luxury</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .hero {
            background: url('https://source.unsplash.com/1600x900/?perfume') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hero h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 10px blue;
        }
        .btn {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }
        .store {
            padding: 50px 20px;
        }
        .contact {
            padding: 50px 20px;
        }
        .product {
            display: inline-block;
            margin: 20px;
            padding: 10px;
            border: 1px solid white;
            border-radius: 5px;
            width: 200px;
        }
        .product img {
            width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>Perfumes de Lujo</h1>
        <p>La esencia de la exclusividad</p>
        <button class="btn">Comprar ahora</button>
    </section>

    <section class="store">
        <h2>Perfumes para Hombres</h2>
        <div class="product">
            <img src="https://source.unsplash.com/200x200/?cologne" alt="Dior Sauvage">
            <h3>Dior Sauvage EDP</h3>
            <p>Precio: $31.50</p>
        </div>
        <div class="product">
            <img src="https://source.unsplash.com/200x200/?cologne" alt="Chanel Bleu">
            <h3>Bleu de Chanel EDP</h3>
            <p>Precio: $34.50</p>
        </div>
    </section>

    <section class="store">
        <h2>Perfumes para Mujeres</h2>
        <div class="product">
            <img src="https://source.unsplash.com/200x200/?perfume" alt="Chanel N°5">
            <h3>Chanel N°5 EDP</h3>
            <p>Precio: $31.50</p>
        </div>
        <div class="product">
            <img src="https://source.unsplash.com/200x200/?perfume" alt="YSL Libre">
            <h3>YSL Libre EDP</h3>
            <p>Precio: $38.97</p>
        </div>
    </section>

    <section class="contact">
        <h2>Contacto</h2>
        <p>Encuéntranos en redes sociales.</p>
    </section>
</body>
</html>
